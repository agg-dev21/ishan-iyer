<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishan Iyer | Portfolio</title>
<meta name="description" content="Ishan Iyer: character design, creature design, game concept art, and animation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #0F1520;
  --bg2:        #141B28;
  --bg3:        #192030;
  --panel:      #1D2638;
  --panel2:     #222D42;
  --border:     #232F44;
  --border2:    #2C3D58;
  --accent:     #D4631A;
  --accent2:    #A84E12;
  --accent-dim: rgba(212,99,26,0.10);
  --accent-glow:rgba(212,99,26,0.06);
  --text:       #CCC8BF;
  --text-dim:   #6E7D96;
  --text-mute:  #3E506A;
  --text-dark:  #253040;
  --radius:     10px;
  --radius-sm:  6px;
  --nav-h:      62px;
  --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
}
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── SCREENS ── */
.screen { display: none; width: 100vw; height: 100vh; position: absolute; inset: 0; }
.screen.active { display: flex; flex-direction: column; }

/* ── SUBTLE SCANLINE ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 3px,
    rgba(0,0,0,0.012) 3px, rgba(0,0,0,0.012) 4px
  );
  pointer-events: none; z-index: 9000;
}

/* ── CORNER HUD ── */
.corners { position: fixed; inset: 0; pointer-events: none; z-index: 8000; }
.c { position: absolute; width: 16px; height: 16px; }
.c.tl { top: 10px; left: 10px; border-top: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); border-radius: 3px 0 0 0; opacity: 0.5; }
.c.tr { top: 10px; right: 10px; border-top: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); border-radius: 0 3px 0 0; opacity: 0.5; }
.c.bl { bottom: 10px; left: 10px; border-bottom: 1.5px solid var(--accent); border-left: 1.5px solid var(--accent); border-radius: 0 0 0 3px; opacity: 0.5; }
.c.br { bottom: 10px; right: 10px; border-bottom: 1.5px solid var(--accent); border-right: 1.5px solid var(--accent); border-radius: 0 0 3px 0; opacity: 0.5; }

/* ════════════════════════════
   NAVIGATION / TOP BAR
════════════════════════════ */
.topbar {
  display: flex;
  align-items: center;
  gap: 0;
  height: var(--nav-h);
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,21,32,0.97);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
  z-index: 100;
  position: relative;
}
.topbar-brand {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-left: 16px;
}
.topbar-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1;
}
.topbar-sub {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 1.5px;
  color: var(--text-mute);
  text-transform: uppercase;
}
.topbar-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
}
.nav-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 8px 16px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  font-family: inherit;
  transition: color var(--transition), background var(--transition);
  white-space: nowrap;
}
.nav-btn:hover { color: var(--text); background: var(--panel); }
.nav-btn.active { color: var(--accent); }
.nav-divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 7px 16px;
  cursor: pointer;
  border-radius: 20px;
  font-family: inherit;
  transition: all var(--transition);
  margin-left: auto;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Hamburger */
.hamburger {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  padding: 8px;
  border-radius: var(--radius-sm);
  transition: background var(--transition);
  border: none;
  background: none;
  flex-shrink: 0;
}
.hamburger:hover { background: var(--panel); }
.hamburger span {
  display: block;
  width: 20px;
  height: 1.5px;
  background: var(--text-dim);
  border-radius: 2px;
  transition: background var(--transition);
}
.hamburger:hover span { background: var(--text); }

/* ════════════════════════════
   SLIDE-IN MENU
════════════════════════════ */
.menu-overlay { position: fixed; inset: 0; z-index: 5000; pointer-events: none; }
.menu-overlay.open { pointer-events: all; }
.menu-backdrop {
  position: absolute; inset: 0;
  background: rgba(6,10,18,0.75);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 0.25s;
}
.menu-overlay.open .menu-backdrop { opacity: 1; }
.menu-panel {
  position: absolute; top: 0; left: 0;
  width: 300px; height: 100%;
  background: var(--bg2);
  border-right: 1px solid var(--border2);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.menu-overlay.open .menu-panel { transform: translateX(0); }
.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 24px;
  border-bottom: 1px solid var(--border);
}
.menu-logo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text);
}
.menu-close {
  background: none;
  border: none;
  color: var(--text-mute);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  transition: color var(--transition), background var(--transition);
  font-family: inherit;
  line-height: 1;
}
.menu-close:hover { color: var(--text); background: var(--panel); }
.menu-about {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.menu-about-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.menu-about-role {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.menu-about-bio {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.7;
}
.menu-section-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-mute);
  padding: 20px 24px 10px;
}
.menu-link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 24px;
  cursor: pointer;
  transition: background var(--transition);
  border: none;
  background: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 400;
  width: 100%;
  text-align: left;
}
.menu-link:hover { background: var(--panel); }
.menu-link-icon {
  width: 30px;
  height: 30px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.menu-link-soon {
  font-size: 9px;
  color: var(--text-mute);
  letter-spacing: 1px;
  margin-left: 6px;
}
.menu-link-arrow { font-size: 11px; color: var(--text-mute); margin-left: auto; }
.menu-socials {
  display: flex;
  gap: 8px;
  padding: 16px 24px;
  margin-top: auto;
  border-top: 1px solid var(--border);
}
.social-btn {
  flex: 1;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  transition: all var(--transition);
  font-family: inherit;
}
.social-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ════════════════════════════
   HOME MAP
════════════════════════════ */
#home {
  cursor: grab;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}
#home.grabbing { cursor: grabbing; }

.map-world {
  position: absolute;
  width: 2400px;
  height: 1600px;
  will-change: transform;
}
.map-grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(212,99,26,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,99,26,0.03) 1px, transparent 1px);
  background-size: 100px 100px;
}
.terrain {
  position: absolute;
  border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
  border: 1px solid rgba(212,99,26,0.05);
  background: rgba(212,99,26,0.014);
}

/* Pins */
.pin {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  z-index: 10;
  transition: transform var(--transition);
  user-select: none;
  -webkit-user-drag: none;
}
.pin:hover { transform: translateY(-7px); }
.pin:hover .pin-label { color: var(--accent); }
.pin:hover .pin-ring { border-color: var(--accent); opacity: 1; transform: scale(1.2); }
.pin-dot {
  width: 10px;
  height: 10px;
  background: var(--bg);
  border: 2px solid var(--accent);
  border-radius: 50%;
  position: relative;
  z-index: 2;
}
.pin-ring {
  position: absolute;
  width: 24px;
  height: 24px;
  border: 1px solid rgba(212,99,26,0.2);
  border-radius: 50%;
  top: -7px; left: -7px;
  opacity: 0.5;
  transition: all 0.2s;
}
.pin-stem {
  width: 1px;
  height: 24px;
  background: linear-gradient(var(--accent), transparent);
}
.pin-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
  white-space: nowrap;
  transition: color 0.2s;
}
.pin-sub {
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--text-dark);
  text-transform: uppercase;
  margin-top: 2px;
}
.map-hint {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
  color: var(--text-dark);
  text-transform: uppercase;
  z-index: 50;
  pointer-events: none;
  white-space: nowrap;
}
.minimap {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 108px;
  height: 72px;
  border: 1px solid var(--border2);
  background: rgba(15,21,32,0.92);
  border-radius: 6px;
  z-index: 50;
  overflow: hidden;
}
.minimap-dot {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.35;
}
.minimap-view {
  position: absolute;
  border: 1px solid rgba(212,99,26,0.5);
  background: rgba(212,99,26,0.05);
  border-radius: 2px;
  transition: all 0.08s;
}

/* WASD hint */
.wasd-hint {
  position: absolute;
  bottom: 28px;
  left: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  animation: wasdFadeIn 1s ease 1.5s forwards;
}
@keyframes wasdFadeIn { to { opacity: 1; } }
.wasd-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dark);
}
.wasd-keys {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.wasd-row { display: flex; gap: 3px; justify-content: center; }
.key {
  width: 22px;
  height: 22px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 600;
  color: var(--text-mute);
  letter-spacing: 0;
}

/* ════════════════════════════
   GAME CONCEPTS PAGE
════════════════════════════ */
#game { background: var(--bg2); }
.game-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.game-filters {
  display: flex;
  gap: 8px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
  align-items: center;
}
.game-filter {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 16px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text-mute);
  cursor: pointer;
  border-radius: 20px;
  font-family: inherit;
  transition: all var(--transition);
}
.game-filter:hover,
.game-filter.on {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.game-count {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-mute);
  letter-spacing: 1px;
}

/* Editorial Game Layout */
.game-scroll {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  padding: 32px 40px 60px;
}
.game-grid-editorial {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}

.game-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
  position: relative;
  display: flex;
  flex-direction: column;
}
.game-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}
.game-card.span-2 { grid-column: span 2; }
.game-card.span-3 { grid-column: span 3; }
.game-card-img-wrap {
  position: relative;
  overflow: hidden;
  background: var(--bg3);
}
.game-card.span-1 .game-card-img-wrap { aspect-ratio: 4/3; }
.game-card.span-2 .game-card-img-wrap { aspect-ratio: 16/7; }
.game-card.span-3 .game-card-img-wrap { aspect-ratio: 21/7; }
.game-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  image-rendering: pixelated;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), filter 0.4s;
}
.game-card:hover .game-card-img { transform: scale(1.04); filter: brightness(1.08); }
.game-card-info {
  padding: 14px 16px;
  flex: 1;
}
.game-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 4px;
}
.game-card-tag {
  display: inline-block;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 3px 8px;
  border-radius: 20px;
}

/* ════════════════════════════
   CLASS PROJECTS PAGE
════════════════════════════ */
#classwork { background: var(--bg2); }
.cw-layout {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* Sidebar */
.cw-sidebar {
  width: 256px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  background: var(--bg);
}
.cw-sidebar-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--text-mute);
  padding: 20px 20px 10px;
}
.cw-proj-btn {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 20px;
  cursor: pointer;
  border: none;
  background: none;
  text-align: left;
  width: 100%;
  border-left: 2px solid transparent;
  transition: all var(--transition);
  font-family: inherit;
}
.cw-proj-btn:hover { background: var(--panel); }
.cw-proj-btn.active { background: var(--panel); border-left-color: var(--accent); }
.cw-proj-btn-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}
.cw-proj-btn-sub {
  font-size: 10px;
  color: var(--text-mute);
  letter-spacing: 0.5px;
}
.cw-proj-btn.active .cw-proj-btn-title { color: var(--accent); }

/* Viewer */
.cw-viewer {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  background: var(--bg2);
}
.cw-viewer-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 36px 36px 60px;
}
.cw-viewer-header {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.cw-viewer-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}
.cw-viewer-sub {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.cw-viewer-desc {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.8;
  max-width: 620px;
}
.cw-page {
  width: 100%;
  border-radius: var(--radius-sm);
  display: block;
  background: var(--bg3);
  border: 1px solid var(--border);
  margin-bottom: 14px;
}
.cw-page:last-child { margin-bottom: 0; }
.cw-page-num {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-mute);
  margin-bottom: 6px;
  margin-top: 20px;
}
.cw-page-num:first-of-type { margin-top: 0; }

/* Empty state */
.cw-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  color: var(--text-mute);
}
.cw-empty-icon { font-size: 44px; opacity: 0.3; }
.cw-empty-text { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }

/* ════════════════════════════
   LIGHTBOX
════════════════════════════ */
.lightbox {
  position: fixed; inset: 0;
  z-index: 7000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(6,9,16,0.95);
  backdrop-filter: blur(10px);
}
.lightbox.open { display: flex; }
.lb-inner {
  position: relative;
  max-width: 92vw;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.lb-img {
  max-width: 88vw;
  max-height: 80vh;
  object-fit: contain;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  image-rendering: pixelated;
}
.lb-info { text-align: center; }
.lb-title { font-size: 15px; font-weight: 600; color: var(--text); }
.lb-tag { font-size: 10px; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
.lb-close {
  position: absolute;
  top: -16px;
  right: -16px;
  width: 34px;
  height: 34px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 50%;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  line-height: 1;
}
.lb-close:hover { background: var(--accent); color: white; border-color: var(--accent); }
.lb-nav { display: flex; gap: 10px; margin-top: 4px; }
.lb-nav-btn {
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--text-dim);
  padding: 8px 22px;
  border-radius: 20px;
  cursor: pointer;

/* Waypoints */

.wp:hover .wp-pin { transform: translateY(-6px); filter: drop-shadow(0 10px 10px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(232,184,106,.45)); }

.ed-single { position: relative; }
.ed-host { position: relative; }

  transform: translateX(100%); transition: transform .28s cubic-bezier(.3,.7,.2,1); display: flex; flex-direction: column; font-family: var(--ui); }

/* ── Shared page scroll ── */

/* ── Heartbreaker ── */
.hb-hero { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); aspect-ratio: 21/8; margin-bottom: 28px; }
.hb-hero-over { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px; background: linear-gradient(transparent, rgba(15,21,32,.95)); }

.hb-intro { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
.hb-note { background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: var(--radius-sm); padding: 16px 18px; font-size: 13px; color: var(--text-dim); line-height: 1.7; align-self: start; }

.region { padding-top: 44px; scroll-margin-top: 16px; }
.region-head { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
.region-num {
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--accent); display: grid; place-items: center;
  font-size: 20px; font-weight: 700; color: var(--accent); background: var(--accent-dim); flex-shrink: 0;
}
.region-title { font-size: 24px; font-weight: 700; }

.sub-label { display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-mute); margin: 28px 0 14px; }
.sub-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.game-card .ph-box { width: 100%; height: 100%; }

.hb-end { margin-top: 56px; padding: 24px; border: 1px dashed var(--border2); border-radius: var(--radius); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hb-end b { font-size: 16px; }
.hb-end span { display: block; font-size: 12px; color: var(--text-mute); margin-top: 3px; }
.depth { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.depth i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--border2); }

/* ── Gallery categories ── */
.gallery-head { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }

.adobe-btn { margin: 12px 16px 6px; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--accent-dim); border: 1px solid rgba(212,99,26,.35); text-decoration: none; transition: all var(--transition); }
.adobe-btn:hover { border-color: var(--accent); background: rgba(212,99,26,.16); }

/* ── About ── */
.about-grid { display: grid; grid-template-columns: 320px 1fr; gap: 44px; }

/* Lightbox placeholder */

}

@media (prefers-reduced-motion: reduce) {

}

.corners, body::after { display: none !important; }

/* ════════════════════════════

════════════════════════════ */
.ld { position: fixed; inset: 0; z-index: 7000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.ld-scene { position: absolute; inset: 0; background: #EEE5D0; will-change: opacity; }
.ld-sun { position: absolute; right: 11vw; top: 14vh; width: min(25vw, 340px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #1B2142;
  background: radial-gradient(circle, #8E2F0C 0 1.8px, transparent 2.1px) 0 0 / 10px 10px, #E2681F; will-change: transform; }
.ld-copy { position: absolute; left: 7vw; top: 15vh; color: #1B2142; will-change: transform; }
.ld-kicker { display: flex; align-items: center; gap: 12px; font: 600 13px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; }

.ld-name { font: 800 clamp(84px, 12.5vw, 210px)/.84 var(--ui); letter-spacing: -.05em; margin: 26px 0 44px; }
.ld-role { font: 500 clamp(15px, 1.35vw, 19px)/1.45 var(--ui); max-width: 440px; color: rgba(27,33,66,.8); }
.ld-sea { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background-color: #2D47A3; background-repeat: repeat; will-change: height; }
.ld-wave { position: absolute; left: 0; bottom: calc(100% - 1px); width: 200%; height: 34px; display: block; animation: ldWave 8s linear infinite; }
.ld-wave.back { bottom: calc(100% + 7px); animation-duration: 13s; animation-direction: reverse; }
@keyframes ldWave { to { transform: translateX(-50%); } }
.ld-bubbles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ld-cue { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px;
  background: none; border: 0; color: #F6EFDF; font: 600 12px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: opacity .3s; }
.ld-cue i { width: 22px; height: 34px; border: 2px solid currentColor; border-radius: 12px; position: relative; }
.ld-cue i::after { content: ''; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px; border-radius: 2px; background: currentColor; animation: ldCue 1.6s ease-in-out infinite; }
@keyframes ldCue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }
.ld-skip { position: absolute; top: 22px; right: 24px; background: none; border: 0; color: #1B2142; font: 600 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; opacity: .6; }

/* ── Project pages: main image first, process on demand ── */

function card(it, ref) {
  return `<div class="game-card span-${spanOf(it)} ${EDIT.on ? 'ed-host' : ''}" ${EDIT.on ? `data-ref="${ref}"` : `tabindex="0" role="button" data-lb`} aria-label="${esc(it.title)}">
    <div class="game-card-img-wrap" style="aspect-ratio:${ratioOf(it)}"><div class="ph-box" style="position:absolute;inset:0">${slot(it)}</div>${EDIT.on ? tools(ref) : ''}</div>
    <div class="game-card-info"><div class="game-card-title" ${ce(ref, 'title', 'Title')}>${esc(it.title)}</div>${it.line || EDIT.on ? `<div class="game-card-line" ${ce(ref, 'line', 'Add a one-line caption')}>${esc(it.line || '')}</div>` : ''}</div></div>`;
}
/* Projects (item.group): one main image up front; the ideation behind it opens when you interact.
   In edit mode it falls back to the plain grid so everything stays editable. */
function sectionGrid(key, items) {
  const order = [...new Set(items.map(it => it.group || ''))];
  return order.map(g => `${g ? `<div class="sub-label">${esc(g)}</div>` : ''}<div class="game-grid-editorial" data-list="${key}">${items.map((it, i) => (it.group || '') === g ? card(it, `L|${key}|${i}`).replace('<div class="game-card', `<div data-i="${i}" class="game-card`) : '').join('')}</div>`).join('');
}
function groupedGrid(key, items, layout) {
  if (EDIT.on || !items.some(it => it.group)) return grid(key, items);
  if (layout === 'sections') return sectionGrid(key, items);
  const order = [...new Set(items.map(it => it.group || ''))];
  return order.map((g, gi) => {
    const idx = items.map((it, i) => (it.group || '') === g ? i : -1).filter(i => i >= 0), main = items[idx[0]], rest = idx.slice(1);
    const tag = (i) => card(items[i], `L|${key}|${i}`).replace('<div class="game-card', `<div data-i="${i}" class="game-card`);
    return `<section class="proj" id="proj-${gi}">
      <div class="proj-head"><div class="proj-num">${String(gi + 1).padStart(2, '0')}</div><div class="proj-title">${esc(g || 'More work')}</div>${main.status ? `<span class="proj-status">${esc(main.status)}</span>` : ''}${idx.length > 1 ? `<div class="proj-count">${idx.length} pieces</div>` : ''}</div>
      <div class="proj-main ${rest.length ? '' : 'solo'}" tabindex="0" role="button" ${rest.length ? `aria-expanded="false" aria-label="${esc(main.title)}: show the process"` : `data-lb data-i="${idx[0]}" aria-label="View ${esc(main.title)} full size"`} style="--r:${ratioOf(main)}">
        <div class="ph-box proj-main-img">${slot(main)}</div>
        ${rest.length ? '' : '<!--'}<button class="proj-zoom" data-lb data-i="${idx[0]}" aria-label="View ${esc(main.title)} full size"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg></button>${rest.length ? '' : '-->'}
      </div>
      <div class="proj-cap"><span>${rest.length ? esc(main.title) : ''}</span>${rest.length ? `<button class="proj-more" aria-expanded="false"><span>See the process</span><small>${rest.length}</small><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>` : ''}</div>
      ${rest.length ? `<div class="proj-rest"><div class="game-grid-editorial" data-list="${key}">${rest.map(tag).join('')}</div></div>` : ''}
    </section>`;
  }).join('');
}
function wireProjects(root) {
  $$('.proj', root).forEach(sec => {
    const more = $('.proj-more', sec), rest = $('.proj-rest', sec), main = $('.proj-main', sec);
    const toggle = (open = !sec.classList.contains('open')) => {
      if (!rest) return;
      sec.classList.toggle('open', open);
      [more, main].forEach(b => b && b.setAttribute('aria-expanded', String(open)));
      if (more) $('span', more).textContent = open ? 'Hide the process' : 'See the process';
      if (open) setTimeout(() => rest.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }), 120);
    };
    main.addEventListener('click', e => { if (!e.target.closest('.proj-zoom')) toggle(); });
    main.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === main) { e.preventDefault(); toggle(); } });
    more && more.addEventListener('click', () => toggle());
  });
}
function grid(key, items) {
  return `<div class="game-grid-editorial" data-list="${key}">${items.map((it, i) => card(it, `L|${key}|${i}`)).join('')}${EDIT.on ? addTile(key) : ''}</div>`;
}
const addTile = key => `<button class="ed-add span-1" data-add="${key}">${EI.plus}<span>Add images</span><small>or drop files here</small></button>`;
function wireCards(root, items, tagFn) {
  if (EDIT.on) return;
  $$('[data-lb]', root).forEach((el, n) => {
    const i = el.dataset.i != null ? +el.dataset.i : n;
    const open = () => openLb(items, i, el, tagFn);
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
}
document.addEventListener('mouseover', e => { const v = e.target.closest && e.target.closest('.game-card') && e.target.closest('.game-card').querySelector('video'); if (v && v.paused) v.play().catch(() => {}); });
document.addEventListener('mouseout', e => { const c = e.target.closest && e.target.closest('.game-card'); if (c && !c.contains(e.relatedTarget)) { const v = c.querySelector('video'); if (v) v.pause(); } });
/* A single editable image (hero, cover, photo) */
function single(key, it, extraClass = '') {
  return `<div class="ph-box ${extraClass} ${EDIT.on ? 'ed-host' : ''}" ${EDIT.on ? `data-ref="S|${key}"` : ''} style="position:absolute;inset:0">${slot(it)}${EDIT.on ? tools(`S|${key}`) : ''}</div>`;
}

    </section>`;
  }).join('');
  el.innerHTML = `
    <div class="topbar">${topbar('game', H.title, c.title + ' · Pixel art')}</div>
    <div class="game-body">
      <div class="game-filters" role="tablist" aria-label="Jump to region">
        <button class="game-filter on" data-jump="hb-top">Overview</button>
        ${H.regions.map(r => `<button class="game-filter" data-jump="r${r.num}">${esc(r.name)}</button>`).join('')}
      </div>
      <div class="game-scroll" id="gameScroll"><div style="max-width:1200px;margin:0 auto">
        <div id="hb-top">
          <div class="hb-hero">${single('hbhero', H.hero)}
            <div class="hb-hero-over" style="pointer-events:none"><div class="page-kicker">${esc(c.title)}</div><div class="page-title">${esc(H.title)}</div></div></div>
          <div class="hb-intro">
            <div><p class="page-desc" ${ce('T|heartbreaker', 'concept')}>${esc(H.concept)}</p>
              <div class="hb-stats">2D action · Level progression · Dante's Inferno · Team of 3</div></div>
            <div class="hb-note"><b>Status: paused</b><span ${ce('T|heartbreaker', 'note')}>${esc(H.note)}</span></div>
          </div>
        </div>
        ${regions}
        <div class="hb-end"><div><b>Deeper layers</b><span>Layers ${H.regions.length} to ${H.totalLayers} are still to be designed.</span></div><a class="back-btn" style="text-decoration:none;margin:0" href="#/">← Back to Map</a></div>
      </div></div>
    </div>`;
  wireCards(el, all, i => tags[i]);
  const sc = $('#gameScroll'), btns = $$('[data-jump]', el);
  btns.forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById(b.dataset.jump);
    sc.scrollTo({ top: t.offsetTop - sc.offsetTop - 8, behavior: reduce ? 'auto' : 'smooth' });
  }));
  sc.addEventListener('scroll', () => {
    let cur = 'hb-top';
    btns.forEach(b => { const t = document.getElementById(b.dataset.jump); if (t.offsetTop - sc.offsetTop - 120 <= sc.scrollTop) cur = b.dataset.jump; });
    btns.forEach(b => b.classList.toggle('on', b.dataset.jump === cur));
  }, { passive: true });
  keep();
}

/* =================================================================
   LIGHTBOX
   ================================================================= */
let lbSet = [], lbI = 0, lbFrom = null, lbTag = null;
function openLb(items, i, from, tagFn) { lbSet = items; lbI = i; lbFrom = from; lbTag = tagFn; drawLb(); $('#lightbox').classList.add('open'); $('#lbClose').focus(); }
function closeLb() { $('#lightbox').classList.remove('open'); $$('#lbStage video').forEach(v => v.pause()); lbFrom && lbFrom.focus(); }
function drawLb() {
  const it = lbSet[lbI];
  const r = ratioOf(it);
  $('#lbStage').innerHTML = it.video ? `<video class="lb-img" src="${esc(it.video)}" ${it.img ? `poster="${esc(it.img)}"` : ''} controls autoplay playsinline></video>` : it.img ? `<img class="lb-img" src="${esc(it.img)}" alt="${esc(it.title)}" style="image-rendering:${it.pixel ? 'pixelated' : 'auto'}">` : `<div class="lb-ph ph-box" style="--r:${r}">${slot(it)}</div>`;
  $('#lbTitle').textContent = it.title;
  $('#lbTag').textContent = `${lbTag ? lbTag(lbI) + ' · ' : ''}${lbI + 1} / ${lbSet.length}`;
}
const stepLb = d => { lbI = (lbI + d + lbSet.length) % lbSet.length; drawLb(); };
$('#lbClose').onclick = closeLb; $('#lbPrev').onclick = () => stepLb(-1); $('#lbNext').onclick = () => stepLb(1);
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
document.addEventListener('keydown', e => {
  if (!$('#lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') stepLb(1); if (e.key === 'ArrowLeft') stepLb(-1);
});

/* Copy email */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;

  b.textContent = 'Copied ✓'; b.classList.add('solid'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('solid'); }, 1600);
});

const SHAPES = [['1/1', 'Square', '1:1'], ['4/3', 'Landscape', '4:3'], ['3/4', 'Portrait', '3:4'], ['16/9', 'Wide', '16:9'], ['21/9', 'Panorama', '21:9'], ['4/1', 'Strip', '4:1']];
const ratioNum = r => { const [a, b] = String(r).split('/').map(Number); return a / (b || 1); };
const nearestShape = n => SHAPES.reduce((best, s) => Math.abs(Math.log(ratioNum(s[0]) / n)) < Math.abs(Math.log(ratioNum(best[0]) / n)) ? s : best)[0];

/* ---------- state, history, autosave ---------- */
const DRAFT_KEY = 'ishan-portfolio-draft';
const hist = [];
function rebind() { SITE = DATA.site; HEARTBREAKER = DATA.heartbreaker; CATEGORIES = DATA.categories; MAP = DATA.map; }
function pushHist() { hist.push(JSON.stringify(DATA)); if (hist.length > 40) hist.shift(); updateBar(); }
let saveT;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(DATA)); setStatus('Saved on this device'); }
    catch { setStatus('Too many large images to autosave. Use Save & download to keep them.', true); }
  }, 250);
}
function commit(fn, { render = true } = {}) { pushHist(); fn(); persist(); if (render) rerender(); }
function rerender() { bindStatic(); renderPins(); route(); }

/* ---------- resolving what a control points at ---------- */
function getList(key) {
  const [a, b, c] = key.split(':');

  if (a === 'hb') return HEARTBREAKER.regions[+b][c];
  return null;
}
function getSingle(key) {
  const [a, b] = key.split(':');
  if (a === 'hbhero') return HEARTBREAKER.hero;
  if (a === 'hbbg') return HEARTBREAKER.regions[+b].background;
  if (a === 'photo') return SITE.photo;
  if (a === 'cover') {
    const c = cat(b), e = MAP.extra.find(x => x.goto === '#/' + b), host = c || e;
    if (!host) return null;
    return host.cover || (host.cover = { img: '', title: (c ? c.title : e.label) + ' cover', fit: 'cover', pos: '50% 50%' });

}

  const [kind, key, i] = ref.split('|');
  if (kind === 'L') { const list = getList(key); return { kind, key, list, index: +i, item: list[+i] }; }
  if (kind === 'S') return { kind, key, item: getSingle(key) };
  if (kind === 'P') { const [ci, pi] = key.split('.').map(Number); const p = CATEGORIES[ci].projects[pi]; p.images = p.images || []; return { kind, key, project: p, index: +i }; }
  return {};
}
function allLists() {
  return [
    ...CATEGORIES.filter(c => c.type === 'gallery').map(c => ({ key: `cat:${c.slug}`, label: c.title })),
    ...HEARTBREAKER.regions.flatMap((r, ri) => [
      { key: `hb:${ri}:characters`, label: `Heartbreaker · ${r.name} · Characters` },
      { key: `hb:${ri}:environment`, label: `Heartbreaker · ${r.name} · Environment` }]),

}
const getPath = path => path.split('.').reduce((o, k) => o == null ? o : o[/^\d+$/.test(k) ? +k : k], DATA);

/* ---------- controls drawn onto images ---------- */

    </div>${list ? `<button class="ed-grip" title="Drag to move">${EI.grip}</button><span class="ed-resize" title="Drag to resize"></span>` : ''}`;
}

/* ---------- images ---------- */
function pickFiles(multiple) {

    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = multiple;
    inp.onchange = () => res([...inp.files]); inp.click();

}
const readURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

async function processImage(file) {
  const url = await readURL(file), img = await loadImg(url), w = img.naturalWidth, h = img.naturalHeight;
  const pixel = file.type === 'image/gif' || (w <= 640 && h <= 640);
  if (file.type === 'image/gif' || file.type === 'image/svg+xml' || (file.type === 'image/png' && file.size < 1.5e6) || Math.max(w, h) <= 1200 && file.size < 400e3)
    return { src: url, pixel, w, h };
  const k = Math.min(1, 2000 / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
  const png = file.type === 'image/png' || file.type === 'image/webp';
  return { src: png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .86), pixel: false, w, h };
}
const cleanName = f => f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^./, m => m.toUpperCase());
async function addImages(key, files) {
  files = files.filter(f => f.type.startsWith('image/')); if (!files.length) return;
  setStatus(`Adding ${files.length} image${files.length > 1 ? 's' : ''}…`);
  const made = await Promise.all(files.map(processImage));
  commit(() => {
    const list = getList(key);
    made.forEach((m, i) => {
      const n = m.w / m.h, ratio = nearestShape(n);
      list.push({ img: m.src, title: cleanName(files[i]), line: '', span: n > 2.6 ? 3 : n > 1.6 ? 2 : 1, ratio, fit: m.pixel ? 'contain' : 'cover', pos: '50% 50%', pixel: m.pixel });
    });
  });
  toast(`Added ${files.length} image${files.length > 1 ? 's' : ''}. Drag them to rearrange.`);
}
async function replaceImage(ref, file) {
  if (!file) return;
  const m = await processImage(file), R = resolve(ref);
  commit(() => {
    if (R.kind === 'P') { R.project.images[R.index] = m.src; return; }
    Object.assign(R.item, { img: m.src, pixel: m.pixel, pos: '50% 50%' });
    if (m.pixel) R.item.fit = 'contain';

}
async function addPages(key, files) {
  files = files.filter(f => f.type.startsWith('image/')); if (!files.length) return;
  const made = await Promise.all(files.map(processImage));
  commit(() => {
    const [ci, pi] = key.split('.').map(Number), p = CATEGORIES[ci].projects[pi];
    p.images = p.images || [];
    const n = Math.max(p.pages || 0, p.images.length);
    // fill empty placeholder pages first, then append
    made.forEach(m => { const gap = Array.from({ length: n }, (_, k) => k).find(k => !p.images[k]); if (gap !== undefined) p.images[gap] = m.src; else p.images.push(m.src); });
    p.pages = Math.max(n, p.images.length);

}

/* ---------- moving items ---------- */
function moveItem(fromRef, toRef, after) {
  const A = resolve(fromRef), B = resolve(toRef);
  commit(() => {
    const [it] = A.list.splice(A.index, 1);
    let at = B.list === A.list && A.index < B.index ? B.index - 1 : B.index;
    B.list.splice(at + (after ? 1 : 0), 0, it);
  });
}
function moveToList(fromRef, key) {
  const A = resolve(fromRef), dest = getList(key);
  if (dest === A.list) return;
  commit(() => { const [it] = A.list.splice(A.index, 1); dest.push(it); });
  toast(`Moved to ${allLists().find(l => l.key === key)?.label || 'section'}`);
}

/* ---------- click actions ---------- */
document.addEventListener('click', async e => {
  if (!EDIT.on) return;
  const add = e.target.closest('[data-add]'); if (add) { addImages(add.dataset.add, await pickFiles(true)); return; }
  const ap = e.target.closest('[data-addpages]'); if (ap) { addPages(ap.dataset.addpages, await pickFiles(true)); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const host = b.closest('[data-ref]'), ref = host && host.dataset.ref; if (!ref) return;
  const R = resolve(ref), act = b.dataset.act;

  if (act === 'fit') commit(() => { R.item.fit = R.item.fit === 'contain' ? 'cover' : 'contain'; });
  if (act === 'size') openPop(b, ref);
  if (act === 'pup' || act === 'pdown') commit(() => { const a = R.project.images, k = R.index, j = act === 'pup' ? k - 1 : k + 1; [a[k], a[j]] = [a[j] || '', a[k] || '']; });

    else if (R.kind === 'P') commit(() => { R.project.images.splice(R.index, 1); R.project.pages = Math.max(0, Math.max(R.project.pages || 0, R.project.images.length + 1) - 1); }), toast('Page deleted', 'Undo', undo);
    else commit(() => { R.item.img = ''; });

/* ---------- drag to rearrange, and drop files from your computer ---------- */
let dragRef = null;
const clearDrop = () => $$('.ed-drop-before, .ed-drop-after, .ed-drop-file').forEach(x => x.classList.remove('ed-drop-before', 'ed-drop-after', 'ed-drop-file'));
/* rearrange with the ⠿ handle (pointer based, works with mouse and touch) */

  const g = EDIT.on && e.target.closest('.ed-grip'); if (!g) return;
  e.preventDefault(); e.stopPropagation();

document.addEventListener('dragover', e => {

    const pages = e.target.closest('[data-addpages]'); if (pages) return addPages(pages.dataset.addpages, files);
    const add = e.target.closest('[data-add]'); if (add) return addImages(add.dataset.add, files);
    const host = e.target.closest('[data-ref]'); if (host) return replaceImage(host.dataset.ref, files[0]);

/* ---------- drag the corner to resize ---------- */
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.ed-resize'); if (!EDIT.on || !h) return;
  e.preventDefault(); e.stopPropagation();
  const cardEl = h.closest('[data-ref]'), wrap = $('.game-card-img-wrap', cardEl), gridEl = cardEl.parentElement, R = resolve(cardEl.dataset.ref);
  const gs = getComputedStyle(gridEl), cols = gs.gridTemplateColumns.split(' ').length, gap = parseFloat(gs.columnGap) || 16;
  const colW = (gridEl.clientWidth - gap * (cols - 1)) / cols, top = wrap.getBoundingClientRect(), left = cardEl.getBoundingClientRect().left;
  const badge = document.createElement('div'); badge.className = 'ed-badge'; wrap.appendChild(badge);
  cardEl.classList.add('ed-resizing');

  const mv = ev => {
    span = Math.max(1, Math.min(cols, Math.round((ev.clientX - left + gap) / (colW + gap))));
    const w = span * colW + (span - 1) * gap, h2 = Math.max(40, ev.clientY - top.top);
    ratio = nearestShape(w / h2);
    cardEl.className = cardEl.className.replace(/span-\d/, 'span-' + span); wrap.style.aspectRatio = ratio;

  };

/* ---------- drag inside a photo to choose the crop ---------- */

/* ---------- typing directly on the page ---------- */
document.addEventListener('focusin', e => { if (EDIT.on && e.target.matches && e.target.matches('[data-ce]')) pushHist(); });
document.addEventListener('input', e => {
  const el = e.target; if (!EDIT.on || !el.matches || !el.matches('[data-ce]')) return;
  const ref = el.dataset.ce, f = el.dataset.field, val = el.innerText.replace(/\n{3,}/g, '\n\n').trim();

/* ---------- login: the editor stays hidden until the owner logs in ---------- */
function sha256(str) {
  const K = [], H = [], isP = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; }, fr = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, i = 0; i < 64; n++) if (isP(n)) { if (i < 8) H[i] = fr(Math.pow(n, 1 / 2)); K[i++] = fr(Math.pow(n, 1 / 3)); }

  m.set(b); m[b.length] = 0x80; const dv = new DataView(m.buffer); dv.setUint32(l - 4, b.length * 8); dv.setUint32(l - 8, Math.floor(b.length / 536870912));
  const r = (x, n) => (x >>> n) | (x << (32 - n)), W = new Array(64);
  for (let o = 0; o < l; o += 64) {
    for (let i = 0; i < 64; i++) W[i] = i < 16 ? dv.getUint32(o + i * 4) : (((r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10)) + W[i - 7] + (r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3)) + W[i - 16]) | 0);
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    [a, bb, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}
function openLogin() {

  setEditing(true);

}

/* =================================================================
   LANDING
   The page opens on the "surface". Scrolling raises the water over it,
   bubbles rush past, and you come up on the map.
   ================================================================= */
function landing(fromMap = false) {
  if ($('#landing')) return;
  if (!fromMap) {
    const start = location.hash.replace(/^#\/?/, '').split('/')[0];
    if (start && start !== 'projects') return;         // deep links go straight to their page
  }
  const wave = (fill, stroke) => {
    let d = 'M0,17'; for (let i = 0; i < 12; i++) d += ' q50,-13 100,0 q50,13 100,0';
    return `<svg class="ld-wave${fill === PAL.seaLine ? ' back' : ''}" viewBox="0 0 2400 34" preserveAspectRatio="none" aria-hidden="true"><path d="${d} V34 H0 Z" fill="${fill}"/>${stroke ? `<path d="${d}" fill="none" stroke="${PAL.ink}" stroke-width="3" vector-effect="non-scaling-stroke"/>` : ''}</svg>`;
  };
  document.body.insertAdjacentHTML('beforeend', `
  <div class="ld" id="landing" role="dialog" aria-modal="true" aria-label="Welcome">
    <div class="ld-scene" id="ldScene">
      <div class="ld-sun" id="ldSun"></div>
      <div class="ld-copy" id="ldCopy">
        <div class="ld-kicker">Portfolio · @${esc(SITE.handle)}</div>
        <h1 class="ld-name">${esc(SITE.name).replace(' ', '<br>')}</h1>
        <p class="ld-role">${esc(SITE.role)}</p>
      </div>
      <div class="ld-sea" id="ldSea">${wave(PAL.seaLine)}${wave(PAL.sea, true)}</div>
    </div>
    <canvas class="ld-bubbles" id="ldBubbles"></canvas>
    <button class="ld-cue" id="ldCue"><span>Scroll to dive in</span><i></i></button>
    <button class="ld-skip" id="ldSkip">Skip</button>
  </div>`);
  const L = $('#landing'), scene = $('#ldScene'), sea = $('#ldSea'), sun = $('#ldSun'), copy = $('#ldCopy'), cue = $('#ldCue'), cv = $('#ldBubbles'), ctx = cv.getContext('2d');
  sea.style.backgroundImage = `url(${oceanURL})`;
  const skipBtn = $('#ldSkip');

  let p = 0, target = 0, lastIn = 0, done = false, W = 0, H = 0, t0 = performance.now(), last = t0;
  const size = () => { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener('resize', size);
  const R = rng(77), B = Array.from({ length: 90 }, () => ({ x: R(), y: R(), r: 3 + Math.pow(R(), 2.2) * 26, sp: .5 + R() * 1.1, ph: R() * 6.28 }));
  const go = v => { target = clamp(v, 0, 1); lastIn = performance.now(); };

  L.addEventListener('wheel', e => { e.preventDefault(); go(target + clamp(e.deltaY, -120, 120) * .0008); }, { passive: false });
  let ty0 = null, tt0 = 0;
  L.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; tt0 = target; }, { passive: true });
  L.addEventListener('touchmove', e => { if (ty0 !== null) go(tt0 + (ty0 - e.touches[0].clientY) / (H * .7)); }, { passive: true });
  cue.addEventListener('click', () => go(1));
  $('#ldSkip').addEventListener('click', () => { p = target = 1; finish(); });
  addEventListener('keydown', e => {
    if (done || e.ctrlKey || e.metaKey || e.altKey) return;
    e.stopImmediatePropagation();
    if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(target + .1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(target - .1); }
    if (['Enter', 'End'].includes(e.key)) { e.preventDefault(); go(1); }
    if (e.key === 'Home') { e.preventDefault(); go(0); }
  }, true);

  function finish() {
    if (done) return; done = true;
    port.style.transform = ''; port.style.transformOrigin = ''; L.remove(); document.body.classList.remove('ld-diving');
    removeEventListener('resize', size);
  }
  function frame(now) {
    if (done) return;
    const dt = Math.min(3, (now - last) / 16.667); last = now;
    // the scroll is in charge: no snapping, it just follows (only the last sliver completes itself)
    if (now - lastIn > 400 && target > .96 && target < 1) target = 1;
    p += (target - p) * Math.min(1, (reduce ? .3 : .1) * dt);
    if (Math.abs(target - p) < .0008) p = target;

    // 1) the water climbs over the page
    const rise = clamp(p / .48, 0, 1), e = 1 - Math.pow(1 - rise, 2);
    const level = 30 + e * 90;
    sea.style.height = level + '%';
    sun.style.transform = `translateY(${(p * 40).toFixed(2)}vh)`;
    copy.style.transform = `translateY(${(-p * 90).toFixed(1)}px)`;
    cue.style.opacity = Math.max(0, 1 - p * 6);
    skipBtn.style.color = level > 97 ? PAL.paper : PAL.ink;
    // 2) fully under: the water is the map's own sea, so the page quietly falls away...
    const f = clamp((p - .47) / .08, 0, 1);
    scene.style.opacity = 1 - f * f * (3 - 2 * f);
    // 3) ...and the camera rises out of the deep onto the map
    const k = clamp((p - .5) / .5, 0, 1), up = Math.pow(1 - k, 2.6);
    const ox = tx + diveAt.x * z, oy = ty + diveAt.y * z;          // where that patch of sea sits on screen
    port.style.transformOrigin = `${ox.toFixed(1)}px ${oy.toFixed(1)}px`;
    port.style.transform = `translate(${((vw() / 2 - ox) * up).toFixed(1)}px, ${((vh() / 2 - oy) * up).toFixed(1)}px) scale(${(1 + 5 * up).toFixed(4)})`;
    cv.style.opacity = 1 - clamp((p - .78) / .22, 0, 1);
    document.body.classList.toggle('ld-diving', p < .9);

    // bubbles: a few drift up at rest, then a rush as you dive
    const waterTop = H * (1 - level / 100), time = (now - t0) / 1000;

    const n = Math.round(B.length * (.22 + .78 * clamp(p * 1.7, 0, 1)));
    ctx.lineWidth = 2; ctx.strokeStyle = PAL.paper; ctx.fillStyle = 'rgba(246,239,223,.12)';

  }

  // so when the page falls away there is nothing but water behind it
  const diveAt = (() => {
    const hw = vw() / 2 / (z * 5), hh = vh() / 2 / (z * 5), isles = [...ISLANDS, ...OUTER];

      const room = Math.min(...isles.map(I => Math.max(Math.abs(x - I.cx) - I.rx - hw, Math.abs(y - I.cy) - I.ry - hh)));
      const sc = Math.min(room, 450) - Math.hypot(x - MAP.W / 2, y - MAP.H / 2) * .03;
      if (sc > best.sc) best = { x, y, sc };
    }
    return best; })();
  document.body.classList.add('ld-diving');
  if (fromMap) { p = 1; go(0); }                       // play the dive backwards, up to the surface
  requestAnimationFrame(frame);
}
landing();

let firstRoute = true;
function route() {
  const key = location.hash.replace(/^#\/?/, '').split('/')[0];
  if ($('#lightbox').classList.contains('open')) { lbFrom = null; closeLb(); }
  closeMenu();
  let screen = 'home';
  const c = cat(key);
  if (c) {
    if (c.type === 'game') { renderGame(); screen = 'game'; }
    else if (c.type === 'classwork') { renderClasswork(c); screen = 'classwork'; }
    else { renderGallery(c); screen = 'gallery'; }
    document.title = c.title + ' | ' + SITE.name;
  } else if (key === 'about') { renderAbout(); screen = 'about'; document.title = 'About Me | ' + SITE.name; }
  else if (key === 'contact') { renderContact(); screen = 'contact'; document.title = 'Contact | ' + SITE.name; }
  else document.title = SITE.name + ' | Portfolio';
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === screen));
  if (screen === 'home') {
    $$('#home .nav-btn').forEach(n => n.classList.toggle('active', n.getAttribute('href') === (key === 'projects' ? '#/projects' : '#/')));
    if (firstRoute) initCam(); else applyT();
    if (key === 'projects') setTimeout(panToProjects, firstRoute ? 300 : 80);
  }
  firstRoute = false;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#/projects"]');
  if (a && location.hash === '#/projects') { e.preventDefault(); closeMenu(); panToProjects(); }
});
addEventListener('hashchange', route);
route();
